name: Build Godot Offline Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Windows standalone
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/Operation-Iron-Veil.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Operation-Iron-Veil-Godot-Windows
          path: |
            build/Operation-Iron-Veil.exe
            build/Operation-Iron-Veil.pck
          if-no-files-found: error
          retention-days: 14
