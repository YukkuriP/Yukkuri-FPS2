name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE and installer
        run: npm run dist:win -- --publish never

      - name: Publish versioned prototype release
        if: github.ref == 'refs/heads/release/v0.2.0' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: "Operation: Iron Veil v0.2.0 Prototype"
          body: |
            Operation: Iron Veil v0.2.0 — Prototype release.

            This is a separate, versioned release from v0.1.0.
            Includes the startup loading sequence, operations lobby, updated city and airport details, and the current playable prototype.

            Downloads:
            - Portable EXE: run without installation.
            - Setup EXE: install the game and create shortcuts.

            Notes:
            - This is a prototype; some player visuals and gameplay systems are still incomplete.
            - Online play requires a reachable game server.
            - The web client currently loads Three.js from a CDN, so an internet connection is required.
          prerelease: false
          make_latest: true
          files: |
            release/Operation-Iron-Veil-Portable-0.2.0.exe
            release/Operation-Iron-Veil-Setup-0.2.0.exe
          fail_on_unmatched_files: true
