name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE and installer
        run: npm run dist:win -- --publish never

      - name: Publish v0.2.0 prototype release
        if: github.ref == 'refs/heads/release/v0.2.0' || github.ref == 'refs/tags/v0.2.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: release/v0.2.0
          name: "Operation: Iron Veil v0.2.0 Prototype"
          body: |
            Operation: Iron Veil v0.2.0 — Prototype release.

            This is a separate formal release from v0.1.0.

            Includes the latest startup loading sequence, operations lobby, city and airport environment updates, and current playable prototype.

            Downloads:
            - Portable EXE: run without installation.
            - Setup EXE: install the game and create shortcuts.

            Prototype notes:
            - Player full-body visuals and some gameplay systems are still under development.
            - Online play requires a reachable game server.
            - The web client loads Three.js from a CDN and requires an internet connection.
          prerelease: false
          make_latest: true
          files: |
            release/Operation-Iron-Veil-Portable-0.2.0.exe
            release/Operation-Iron-Veil-Setup-0.2.0.exe
          fail_on_unmatched_files: true
