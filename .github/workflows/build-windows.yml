name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE and installer
        run: npm run dist:win -- --publish never

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v0.1.0' || github.ref_name }}
          name: "Operation: Iron Veil v0.1.0"
          body: |
            Operation: Iron Veil — Windows release build.

            Downloads:
            - Portable EXE: run without installation.
            - Setup EXE: install the game and create shortcuts.

            This release includes the portable Windows app and the installer. Online play requires a reachable game server. The game currently loads Three.js from a CDN, so an internet connection is required.
          prerelease: false
          make_latest: true
          files: |
            release/Operation-Iron-Veil-Portable-0.1.0.exe
            release/Operation-Iron-Veil-Setup-0.1.0.exe
          fail_on_unmatched_files: true
