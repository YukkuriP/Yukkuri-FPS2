name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE and installer
        run: npm run dist:win

      - name: Publish prototype release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v0.1.0-prototype' || github.ref_name }}
          name: Operation: Iron Veil v0.1.0 Prototype
          body: |
            Prototype Windows build of Operation: Iron Veil.

            Downloads:
            - Portable EXE: run without installation.
            - Setup EXE: install the game and create shortcuts.

            This is an early prototype and has not been fully tested on all Windows devices. Online play requires a reachable game server. The game currently loads Three.js from a CDN, so an internet connection is required.
          prerelease: true
          make_latest: false
          files: |
            release/Operation-Iron-Veil-Portable-0.1.0.exe
            release/Operation-Iron-Veil-Setup-0.1.0.exe
          fail_on_unmatched_files: true
