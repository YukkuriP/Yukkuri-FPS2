name: Project Static Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project and parse GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-check.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' godot-check.log; then
            echo "Godot reported a script or project error."
            exit 1
          fi

      - name: Check JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --check web/client.js
      - run: node --check desktop/main.cjs

      - name: Check Python syntax
        run: python -m compileall -q server
