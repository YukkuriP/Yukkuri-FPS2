<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Operation: Iron Veil — Web Edition</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="intro" class="screen">
  <div class="eyebrow">OPERATION: IRON VEIL</div>
  <div id="credit">ゆっくりP製作</div>
  <div class="sub">INITIALIZING SYSTEMS</div>
</div>
<div id="lobby" class="screen hidden">
  <header><div class="eyebrow">YUKKURI P PRODUCTION</div><h1>OPERATION: <span>IRON VEIL</span></h1><p>WEB EDITION · ONLINE TEST BUILD</p></header>
  <section class="panel">
    <h2>オンラインロビー</h2>
    <label>プレイヤー名<input id="playerName" maxlength="16" value="Operator"></label>
    <label>ルームコード<input id="roomCode" maxlength="12" value="IRON-01"></label>
    <label>WebSocketサーバーURL<input id="serverUrl" value="wss://iron-veil-server.onrender.com" placeholder="wss://your-server.example" autocomplete="url"></label>
    <button id="joinBtn">ロビーに接続</button>
    <p id="status">サーバー未接続。オンラインプレイにはWebSocketサーバーが必要です。</p>
    <p class="hint">操作：WASD / 矢印キーで移動、マウスで視点。スマホは画面上の操作ボタンを使用。</p>
  </section>
  <footer>EARLY PROTOTYPE · ONLINE SERVER REQUIRED</footer>
</div>
<div id="game" class="hidden">
  <canvas id="view"></canvas>
  <div id="hud"><div>IRON VEIL <span id="roomLabel"></span></div><div id="players">接続プレイヤー: 1</div><button id="leaveBtn">ロビーへ戻る</button></div>
  <div id="crosshair">+</div>
  <div id="touchControls">
    <div class="pad"><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div>
    <div class="lookpad">視点操作<br><small>右側をドラッグ</small></div>
  </div>
</div>
<script type="module" src="./client.js"></script>
</body>
</html>
